name: Build and publish image

on:
  workflow_dispatch:
    inputs:
      indico_version:
        description: 'Indico version (git tag without "v", e.g. 3.3.14)'
        required: true
        default: '3.3.14'
      autoaccept_ref:
        description: 'indico-plugin-autoaccept git ref (tag/branch)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Transifex token (optional)
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          printf '%s' "$TX_TOKEN" > "$RUNNER_TEMP/tx_token"
          if [ -s "$RUNNER_TEMP/tx_token" ]; then echo "Transifex token: set"; else echo "Transifex token: not set, using fallback translation"; fi

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/indico-ru" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            INDICO_VERSION=${{ inputs.indico_version }}
            TX_PULL_ID=${{ github.run_id }}
          build-contexts: |
            autoaccept=https://github.com/markpolyak/indico-plugin-autoaccept.git#${{ inputs.autoaccept_ref }}
          secret-files: |
            tx_token=${{ runner.temp }}/tx_token
          tags: |
            ${{ steps.name.outputs.image }}:${{ inputs.indico_version }}
            ${{ steps.name.outputs.image }}:${{ inputs.indico_version }}-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove token file
        if: always()
        run: rm -f "$RUNNER_TEMP/tx_token"
